        function generarID() {
            return 'prod-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
        }

        const CLOUD_NAME = "dei5fnqt5";
        const UPLOAD_PRESET = "pwa-unsigned";


        console.log("¿Existe imgProducto?", document.getElementById("imgProducto"));

        //Inicialiazar modal de Bootstrap
        const modal = new bootstrap.Modal(document.getElementById('proyectoModal'));

        //Esta funcion es para guardar  los productos en el localStorage

        //let urlImagen = "";

        //Formatear numero a moneda MXN
        function currencyMX(n) {
            return Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        //Toast Helper al subir Producto
        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast align-items-center text-bg-' + (type === 'success' ? 'success' : 'danger') + ' position-fixed top-0 end-0 m-3';
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>`;
                document.body.appendChild(toast);
                const bsToast = new bootstrap.Toast(toast);
                bsToast.show();
                setTimeout(() => toast.remove(), 3500);
        }

        async function subirImagenCloudinary(file) {
        const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`;

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        const res = await fetch(url, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (!data.secure_url) {
            throw new Error("Error al subir imagen a Cloudinary");
        }

        return data.secure_url; // URL de la imagen
    }

        // FUNCIÓN DE BÚSQUEDA
        function buscarProductos(productos, termino) {
            if (!termino || termino.trim() === '') {
                return productos;
            }
            
            const terminoLower = termino.toLowerCase().trim();
            
            return productos.filter(p => {
                const nombre = (p.nombre || '').toLowerCase();
                const modelo = (p.modelo || '').toLowerCase();
                const clave = (p.clave || '').toLowerCase();
                const descripcion = (p.descripcion || '').toLowerCase();
                
                return nombre.includes(terminoLower) || 
                    modelo.includes(terminoLower) || 
                    clave.includes(terminoLower) ||
                    descripcion.includes(terminoLower);
            });
        }

        // RENDERIZAR PAGINACIÓN
        function renderPagination(totalProductos) {
            const paginationContainer = document.getElementById('pagination');
            
            if (productosPorPagina === 'all' || totalProductos <= productosPorPagina) {
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }
            
            document.getElementById('paginationContainer').style.display = 'block';
            
            const totalPaginas = Math.ceil(totalProductos / productosPorPagina);
            paginationContainer.innerHTML = '';
            
            // Botón Anterior
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${paginaActual === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `
                <a class="page-link" href="#productos" aria-label="Anterior">
                    <i class="fas fa-chevron-left"></i>
                </a>
            `;
            prevLi.addEventListener('click', (e) => {
                e.preventDefault();
                if (paginaActual > 1) {
                    paginaActual--;
                    renderProducts(categoriaActual);
                }
            });
            paginationContainer.appendChild(prevLi);
            
            // Páginas
            let startPage = Math.max(1, paginaActual - 2);
            let endPage = Math.min(totalPaginas, paginaActual + 2);
            
            // Ajustar si estamos al inicio o al final
            if (paginaActual <= 3) {
                endPage = Math.min(5, totalPaginas);
            }
            if (paginaActual >= totalPaginas - 2) {
                startPage = Math.max(1, totalPaginas - 4);
            }
            
            // Primera página
            if (startPage > 1) {
                const firstLi = document.createElement('li');
                firstLi.className = 'page-item';
                firstLi.innerHTML = `<a class="page-link" href="#productos">1</a>`;
                firstLi.addEventListener('click', (e) => {
                    e.preventDefault();
                    paginaActual = 1;
                    renderProducts(categoriaActual);
                });
                paginationContainer.appendChild(firstLi);
                
                if (startPage > 2) {
                    const dotsLi = document.createElement('li');
                    dotsLi.className = 'page-item disabled';
                    dotsLi.innerHTML = `<span class="page-link">...</span>`;
                    paginationContainer.appendChild(dotsLi);
                }
            }
            
            // Páginas numeradas
            for (let i = startPage; i <= endPage; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === paginaActual ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#productos">${i}</a>`;
                li.addEventListener('click', (e) => {
                    e.preventDefault();
                    paginaActual = i;
                    renderProducts(categoriaActual);
                });
                paginationContainer.appendChild(li);
            }
            
            // Última página
            if (endPage < totalPaginas) {
                if (endPage < totalPaginas - 1) {
                    const dotsLi = document.createElement('li');
                    dotsLi.className = 'page-item disabled';
                    dotsLi.innerHTML = `<span class="page-link">...</span>`;
                    paginationContainer.appendChild(dotsLi);
                }
                
                const lastLi = document.createElement('li');
                lastLi.className = 'page-item';
                lastLi.innerHTML = `<a class="page-link" href="#productos">${totalPaginas}</a>`;
                lastLi.addEventListener('click', (e) => {
                    e.preventDefault();
                    paginaActual = totalPaginas;
                    renderProducts(categoriaActual);
                });
                paginationContainer.appendChild(lastLi);
            }
            
            // Botón Siguiente
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${paginaActual === totalPaginas ? 'disabled' : ''}`;
            nextLi.innerHTML = `
                <a class="page-link" href="#productos" aria-label="Siguiente">
                    <i class="fas fa-chevron-right"></i>
                </a>
            `;
            nextLi.addEventListener('click', (e) => {

                if (paginaActual < totalPaginas) {

                    renderProducts(categoriaActual);
                }
            });

        // Funcion para comprimir imagenes de los productos
        // Lee y COMPRIME múltiples imágenes
        function readFilesAsDataURLs(fileList, maxSize = 512) {
            const files = Array.from(fileList || []);

            return Promise.all(files.map(file => compressImage(file, maxSize)));
        }

        // Comprime una sola imagen
        function compressImage(file, maxSize = 512) {
            return new Promise((resolve, reject) => {

                const reader = new FileReader();
                reader.onload = e => {

                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");

                        // Obtener tamaño original
                        let width = img.width;
                        let height = img.height;

                        // Redimensionar si es necesario
                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);

                        // Comprimir como JPG calidad 0.75
                        const dataURL = canvas.toDataURL("image/jpeg", 0.75);

                        resolve({
                            name: file.name,
                            type: "image/jpeg",
                            dataURL: dataURL
                        });
                    };

                    img.onerror = reject;
                    img.src = e.target.result;
                };

                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

       /* -----------------------------
        EVENT LISTENERS PARA SLIDER DE CATEGORÍAS
        -----------------------------*/
        const categoryButtons = document.querySelectorAll('.category-btn');
        const slider = document.getElementById('categorySlider');

        // Click en botones de categoría
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remover active de todos
                categoryButtons.forEach(b => b.classList.remove('active'));
                
                // Agregar active al click
                this.classList.add('active');
                
                // Obtener categoría
                const categoria = this.getAttribute('data-categoria');
                categoriaActual = categoria;
                
                // Autocentrar el botón seleccionado
                this.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'center'
                });
                
                // Renderizar productos filtrados
                renderProducts(categoria);
            });
        });

        // Soporte para arrastrar con mouse (escritorio)
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });
        // INICIO
        loadProducts();

        // LIMPIAR AL CERRAR MODAL
        document.getElementById('proyectoModal').addEventListener('hidden.bs.modal', function () {
            // Resetear modo edición
            productoEditando = null;
            
            // Restaurar título
            document.getElementById('modalTitleText').textContent = 'Registro de Nuevo Producto';
            
            // Limpiar formulario
            document.getElementById('productoForm').reset();
        });

        </script>
