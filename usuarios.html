<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Usuarios | GadgetGo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://kit.fontawesome.com/a2d9d5a64b.js" crossorigin="anonymous"></script>

<style>
    :root { --primary-blue: #122C4F; }

    body { background-color: #fff6e0; }
    .navbar-inventario { 
        background-color: var(--primary-blue);
        color: white;
    }
    .navbar-inventario .navbar-brand { 
        color: white; 
        font-weight: 700; }

    .nav-link {
        color: white;
        margin: 0 1rem;
        font-weight: 500;
    }

    .btn-primary-inv {
        background-color: var(--primary-blue);
        color: #fff;
        border-radius: 8px;
    }
    .card-inv {
        border-radius: 16px;
        background: white;
        box-shadow: 0 5px 18px rgba(0,0,0,0.12);
        border: none;
    }
    table thead {
        background-color: var(--primary-blue); 
        color: white; 
    }
    table tbody tr:hover { 
        background-color: #e3ebff; 
    }
    .badge-role { 
        background-color: var(--primary-blue); 
    }
</style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #122C4F;">
        <div class="container-fluid">
            <a href="index.html">
                <img src="./icons/icon-512.png" alt="LogoGadget-Go" width="80">
            </a>
            <h2 class="px-5 text-white" style="color: #122C4F; font-weight: 700;">Usuarios</h2>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html" style="font-size: 1.2rem;">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#productos" style="font-size: 1.2rem;">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario2.html" style="font-size: 1.2rem;">Inventario</a></li>
                </ul>
            </div>
        </div>
    </nav>

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="color:var(--primary-blue); font-weight:700;">Usuarios Registrados</h2>
        <button class="btn btn-primary-inv" data-bs-toggle="modal" data-bs-target="#modalCrear">
            <i class="fas fa-user-plus"></i> Crear Usuario
        </button>
    </div>

    <!-- BUSCADOR Y FILTRO -->
    <div class="card card-inv mb-4">
        <div class="card-body row g-3">

            <div class="col-md-6">
                <label class="fw-bold">Buscar usuario</label>
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por nombre o email">
            </div>

            <div class="col-md-4">
                <label class="fw-bold">Filtrar por rol</label>
                <select id="filtroRol" class="form-control">
                    <option value="todos">Todos</option>
                    <option value="admin">Administrador</option>
                    <option value="usuario">Usuario</option>
                </select>
            </div>

        </div>
    </div>

    <!-- TABLA -->
    <div class="card card-inv">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Nombre</th>
                            <th>Rol</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosContainer"></tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <button id="btnPrev" class="btn btn-secondary btn-sm">Anterior</button>
                <span id="pageInfo"></span>
                <button id="btnNext" class="btn btn-secondary btn-sm">Siguiente</button>
            </div>
        </div>
    </div>

</div>

<!-- MODALES ======================= -->
<div class="modal fade" id="modalEditar" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content card-inv">
    <div class="modal-header" style="background:var(--primary-blue); color:white;">
        <h5 class="modal-title">Editar Usuario</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <p><strong>Email:</strong> <span id="editEmail"></span></p>
        <label class="fw-bold">Rol:</label>
        <select id="editRol" class="form-control mt-2">
            <option value="usuario">Usuario</option>
            <option value="admin">Administrador</option>
        </select>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnGuardarCambios" class="btn btn-primary-inv">Guardar</button>
    </div>
</div>
</div>
</div>

<!-- MODAL CREAR -->
<div class="modal fade" id="modalCrear" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content card-inv">
    <div class="modal-header" style="background:var(--primary-blue); color:white;">
        <h5 class="modal-title">Crear Usuario</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <label>Email</label>
        <input id="nuevoEmail" class="form-control mb-3">
        <label>Nombre</label>
        <input id="nuevoNombre" class="form-control mb-3">
        <label>Rol</label>
        <select id="nuevoRol" class="form-control mb-3">
            <option value="usuario">Usuario</option>
            <option value="admin">Administrador</option>
        </select>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnCrearUsuario" class="btn btn-primary-inv">Crear</button>
    </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
/* -------------------------
   FIREBASE
------------------------- */

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } 
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBg9o3wVZoA26Aob2RnbVPV8vGv4GE44gs",
    authDomain: "primer-proyecto-7b2f4.firebaseapp.com",
    projectId: "primer-proyecto-7b2f4",
    storageBucket: "primer-proyecto-7b2f4.appspot.com",
    messagingSenderId: "627220736817",
    appId: "1:627220736817:web:a2eb4f187322c609f11e10"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* -------------------------
  VARIABLES DE PAGINACIÓN
------------------------- */

let listaUsuarios = [];   // todos
let filtrados = [];       // búsqueda + filtros
let page = 1;
let perPage = 10;

/* -------------------------
   CARGAR USUARIOS
------------------------- */

async function cargarUsuarios() {
    listaUsuarios = [];
    const snap = await getDocs(collection(db, "usuarios"));
    snap.forEach(d => listaUsuarios.push({ id: d.id, ...d.data() }));
    aplicarFiltros();
}

/* -------------------------
   APLICAR BUSQUEDA / FILTROS
------------------------- */

function aplicarFiltros() {
    const texto = document.getElementById("inputBuscar").value.toLowerCase();
    const rol = document.getElementById("filtroRol").value;

    filtrados = listaUsuarios.filter(u => {
        const matchTexto = u.email.toLowerCase().includes(texto) ||
                           (u.nombre ?? "").toLowerCase().includes(texto);
        const matchRol = rol === "todos" || u.rol === rol;
        return matchTexto && matchRol;
    });

    page = 1;
    renderTabla();
}

/* -------------------------
        RENDER PAGINADO
------------------------- */

function renderTabla() {
    const tbody = document.getElementById("usuariosContainer");
    tbody.innerHTML = "";

    const start = (page - 1) * perPage;
    const pageUsers = filtrados.slice(start, start + perPage);

    pageUsers.forEach(u => {
        tbody.innerHTML += `
            <tr>
                <td>${u.email}</td>
                <td>${u.nombre ?? "—"}</td>
                <td><span class="badge badge-role">${u.rol}</span></td>
                <td class="text-center">
                    <button class="btn btn-warning btn-sm me-2"
                        onclick="editarUsuario('${u.id}','${u.email}','${u.rol}')">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-danger btn-sm"
                        onclick="eliminarUsuario('${u.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>`;
    });

    /* INFO PÁGINA */
    const pageInfo = document.getElementById("pageInfo");
    const totalPages = Math.ceil(filtrados.length / perPage) || 1;

    pageInfo.textContent = `Página ${page} / ${totalPages}`;

    document.getElementById("btnPrev").disabled = page === 1;
    document.getElementById("btnNext").disabled = page === totalPages;
}

/* BOTONES DE PAGINACIÓN */
document.getElementById("btnPrev").onclick = () => { page--; renderTabla(); };
document.getElementById("btnNext").onclick = () => { page++; renderTabla(); };

document.getElementById("inputBuscar").oninput = aplicarFiltros;
document.getElementById("filtroRol").onchange = aplicarFiltros;

/* -------------------------
    EDITAR / ELIMINAR
------------------------- */

window.editarUsuario = function(id, email, rol) {
    window.editID = id;
    document.getElementById("editEmail").textContent = email;
    document.getElementById("editRol").value = rol;

    new bootstrap.Modal(document.getElementById("modalEditar")).show();
};

document.getElementById("btnGuardarCambios").onclick = async () => {
    await updateDoc(doc(db, "usuarios", window.editID), {
        rol: document.getElementById("editRol").value
    });
    cargarUsuarios();
};

window.eliminarUsuario = async function(id) {
    if (confirm("¿Eliminar usuario?")) {
        await deleteDoc(doc(db, "usuarios", id));
        cargarUsuarios();
    }
};

/* -------------------------
        CREAR
------------------------- */

document.getElementById("btnCrearUsuario").onclick = async () => {
    await addDoc(collection(db, "usuarios"), {
        email: document.getElementById("nuevoEmail").value,
        nombre: document.getElementById("nuevoNombre").value,
        rol: document.getElementById("nuevoRol").value
    });

    cargarUsuarios();
};

cargarUsuarios();
</script>

</body>
</html>
